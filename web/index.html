<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self' blob:; child-src 'self'; frame-src 'self'; img-src 'self' data: blob:"><title>H5P Claude Viewer</title><style>
body{margin:0;font:14px system-ui,sans-serif;color:#1f2937;background:#f8fafc;display:flex;height:100vh;overflow:hidden}
aside{width:280px;min-width:200px;border-right:1px solid #dbe3ea;background:#fff;display:flex;flex-direction:column;overflow:hidden}
aside header{padding:.6rem .8rem;border-bottom:1px solid #dbe3ea;font-weight:700;font-size:15px;color:#123b35}
aside header span{display:block;font-weight:400;font-size:11px;color:#52606d;margin-top:2px}
#pkg-list{flex:1;overflow-y:auto;padding:.4rem}
.pkg-item{padding:.5rem .6rem;border-radius:6px;cursor:pointer;margin-bottom:2px;font-size:13px;line-height:1.3}
.pkg-item:hover{background:#eef2f7}
.pkg-item.active{background:#123b35;color:#fff}
.pkg-item .pkg-title{font-weight:600;display:block}
.pkg-item .pkg-meta{font-size:11px;opacity:.7;display:block;margin-top:2px}
#pkg-empty{padding:1rem;color:#52606d;font-size:12px;text-align:center}
#sidebar-footer{padding:.5rem .8rem;border-top:1px solid #dbe3ea;font-size:11px;color:#52606d}
#sidebar-footer button{width:100%;padding:.35rem;border:1px solid #9aaabd;border-radius:4px;background:#fff;cursor:pointer;font-size:12px;margin-top:4px}
#sidebar-footer button:hover{background:#eef2f7}
main{flex:1;display:flex;flex-direction:column;overflow:hidden}
header.topbar{display:flex;align-items:center;gap:.75rem;padding:.45rem .8rem;border-bottom:1px solid #dbe3ea;background:#fff}
#pkg-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#status{color:#52606d;font-size:12px}
.topbar button{margin-left:auto;padding:.3rem .65rem;border:1px solid #9aaabd;border-radius:4px;background:#fff;cursor:pointer;font-size:12px}
.topbar button:hover{background:#eef2f7}
#player-area{flex:1;position:relative;overflow:hidden}
#player{display:block;width:100%;height:100%;min-height:240px;border:0;background:#fff}
#bottom-panel{height:180px;min-height:80px;border-top:2px solid #dbe3ea;background:#fff;display:flex;overflow:hidden}
#bottom-panel .tab-bar{width:120px;border-right:1px solid #dbe3ea;display:flex;flex-direction:column}
.tab-bar button{padding:.5rem .6rem;border:none;background:none;text-align:left;cursor:pointer;font-size:12px;border-bottom:1px solid #eef2f7;color:#52606d}
.tab-bar button.active{background:#123b35;color:#fff}
.tab-bar button:hover:not(.active){background:#eef2f7}
.tab-content{flex:1;overflow:auto;padding:.5rem;font-size:12px;font-family:'Cascadia Code',Consolas,monospace;white-space:pre-wrap;word-break:break-word}
#xapi-log,#score-log,#event-log{display:none}
#xapi-log.active,#score-log.active,#event-log.active{display:block}
.empty-msg{color:#9aaabd;padding:1rem;text-align:center}
.score-row{padding:.3rem 0;border-bottom:1px solid #f0f0f0}
.score-row .score-obj{font-weight:600}
.score-row .score-val{color:#123b35}
.score-row .score-raw{color:#52606d;font-size:11px}
#resize-handle{height:4px;background:#dbe3ea;cursor:ns-resize;flex-shrink:0}
#resize-handle:hover{background:#123b35}
</style></head>
<body>
<aside>
  <header>H5P Claude Viewer<span>Local package browser</span></header>
  <div id="pkg-list"><div id="pkg-empty">No packages found.<br>Copy .h5p files to the<br><code>packages/</code> folder.</div></div>
  <div id="sidebar-footer">
    <button id="refresh-pkgs" type="button">Refresh list</button>
    <button id="clear-xapi" type="button">Clear xAPI log</button>
  </div>
</aside>
<main>
  <header class="topbar">
    <span id="pkg-name">No package selected</span>
    <span id="status">Ready</span>
    <button id="reload" type="button">Reload</button>
  </header>
  <div id="player-area">
    <iframe id="player" title="H5P content" allow="fullscreen; autoplay" allowfullscreen></iframe>
  </div>
  <div id="resize-handle"></div>
  <div id="bottom-panel">
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="event-log">Events</button>
      <button class="tab-btn" data-tab="xapi-log">xAPI</button>
      <button class="tab-btn" data-tab="score-log">Scores</button>
    </div>
    <div class="tab-content">
      <div id="event-log" class="active"><span class="empty-msg">No events yet.</span></div>
      <div id="xapi-log"><span class="empty-msg">No xAPI statements yet.</span></div>
      <div id="score-log"><span class="empty-msg">No scores yet.</span></div>
    </div>
  </div>
</main>
<script type="module" src="./app.js"></script>
</body></html>
